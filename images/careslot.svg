<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram: two clients try to book the same appointment slot, one succeeds and the other gets a conflict">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#0066ff"/></linearGradient>
</defs>
<style>
  .slt{font:600 11px Inter,Arial,sans-serif;fill:#aab4c6}
  .free,.freeS{font:500 8.5px Inter,Arial,sans-serif;fill:#6f7b92}
  .free{animation:fr 9s infinite}
  @keyframes fr{0%,27%{opacity:1}30%,88%{opacity:0}92%,100%{opacity:1}}
  .booked{font:700 9px Inter,Arial,sans-serif;fill:#00ff88;opacity:0;animation:bk 9s infinite}
  @keyframes bk{0%,28%{opacity:0}34%,86%{opacity:1}92%,100%{opacity:0}}
  .slot{fill:#161a2c;stroke:#2c3358;stroke-width:1.3}
  .target{animation:book 9s infinite}
  @keyframes book{0%,26%{fill:#161a2c;stroke:#2c3358}32%,86%{fill:rgba(0,255,136,.16);stroke:#00ff88}92%,100%{fill:#161a2c;stroke:#2c3358}}
  .lab{font:700 10px Inter,Arial,sans-serif}
  .ca{animation:ca 9s infinite cubic-bezier(.5,0,.3,1)}
  @keyframes ca{0%,6%{transform:translate(0,0);opacity:1}26%{transform:translate(367px,-13px);opacity:1}30%,90%{transform:translate(367px,-13px);opacity:0}91%{transform:translate(0,0);opacity:0}96%,100%{transform:translate(0,0);opacity:1}}
  .cb{animation:cb 9s infinite cubic-bezier(.5,0,.3,1)}
  @keyframes cb{0%,12%{transform:translate(0,0)}24%{transform:translate(52px,-14px)}36%,100%{transform:translate(0,0)}}
  .bad{opacity:0;animation:bad 9s infinite}
  @keyframes bad{0%,22%{opacity:0}28%,64%{opacity:1}72%,100%{opacity:0}}
  .flow{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-20}}
  .env{opacity:0;animation:env 9s infinite ease-out}
  @keyframes env{0%,44%{opacity:0;transform:translateY(8px)}52%,80%{opacity:1;transform:translateY(0)}88%,100%{opacity:0;transform:translateY(-6px)}}
  .rpulse{animation:rp 9s infinite}
  @keyframes rp{0%,24%,52%,100%{opacity:.45}28%,44%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.booked{opacity:1}.free{opacity:0}}
</style>
<rect width="500" height="240" rx="18" fill="#0a0a14"/>
<text x="238" y="44" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf5">Dr. Rao · Tuesday</text>
<g><rect class="slot" x="238" y="62" width="70" height="42" rx="9"/><text x="273" y="81" class="slt" text-anchor="middle">09:00</text><text class="freeS" x="273" y="96" text-anchor="middle">free</text></g><g><rect class="slot" x="316" y="62" width="70" height="42" rx="9"/><text x="351" y="81" class="slt" text-anchor="middle">09:30</text><text class="freeS" x="351" y="96" text-anchor="middle">free</text></g><g><rect class="slot target" x="394" y="62" width="70" height="42" rx="9"/><text x="429" y="81" class="slt" text-anchor="middle">10:00</text><text class="free" x="429" y="96" text-anchor="middle">free</text><text class="booked" x="429" y="96" text-anchor="middle">booked ✓</text></g><g><rect class="slot" x="238" y="116" width="70" height="42" rx="9"/><text x="273" y="135" class="slt" text-anchor="middle">10:30</text><text class="freeS" x="273" y="150" text-anchor="middle">free</text></g><g><rect class="slot" x="316" y="116" width="70" height="42" rx="9"/><text x="351" y="135" class="slt" text-anchor="middle">11:00</text><text class="freeS" x="351" y="150" text-anchor="middle">free</text></g><g><rect class="slot" x="394" y="116" width="70" height="42" rx="9"/><text x="429" y="135" class="slt" text-anchor="middle">11:30</text><text class="freeS" x="429" y="150" text-anchor="middle">free</text></g>
<line class="flow" x1="82" y1="96" x2="102" y2="118" stroke="#0066ff" stroke-width="1.6"/>
<line class="flow" x1="82" y1="168" x2="102" y2="150" stroke="#0066ff" stroke-width="1.6"/>
<line class="flow" x1="188" y1="133" x2="236" y2="90" stroke="#0066ff" stroke-width="1.6"/>
<rect x="102" y="86" width="86" height="94" rx="12" fill="#12162a" stroke="#2c3358"/>
<text x="145" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e6ebf5">Booking API</text>
<text x="145" y="128" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#8be9fd">idempotency key</text>
<text x="145" y="142" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#8be9fd">unique(slot)</text>
<text x="145" y="164" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7c879c">MySQL + Redis</text>
<g class="ca"><circle cx="62" cy="96" r="17" fill="#10162c" stroke="#00ff88" stroke-width="2"/><text x="62" y="101" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#00ff88">A</text></g>
<g class="cb"><circle cx="62" cy="168" r="17" fill="#10162c" stroke="#ff6b81" stroke-width="2"/><text x="62" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ff6b81">B</text></g>
<text x="62" y="130" text-anchor="middle" class="slt">client A</text>
<text x="62" y="202" text-anchor="middle" class="slt">client B</text>
<g class="bad"><rect x="16" y="210" width="92" height="18" rx="9" fill="rgba(255,107,129,.16)" stroke="#ff6b81"/><text x="62" y="222.5" text-anchor="middle" class="lab" fill="#ff6b81">409 slot taken</text></g>
<rect x="238" y="178" width="226" height="40" rx="10" fill="#12162a" stroke="#2c3358"/>
<text x="250" y="195" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#e6ebf5">Outbox → queue → reminder</text>
<text x="250" y="209" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#7c879c">sent after the booking commits</text>
<g class="env"><rect x="430" y="190" width="18" height="12" rx="2" fill="none" stroke="#00ff88" stroke-width="1.4"/><path d="M430 191l9 6.5 9-6.5" fill="none" stroke="#00ff88" stroke-width="1.4"/></g>
<rect class="rpulse" x="102" y="188" width="86" height="22" rx="8" fill="#12162a" stroke="#d1423f"/>
<text class="rpulse" x="145" y="203" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#ff8a80">Redis cache</text>
</svg>