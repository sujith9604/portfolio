<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated preview of the portfolio website: browser window, navigation tabs switching, and a typing hero line">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#0066ff"/></linearGradient>
  <clipPath id="win"><rect x="22" y="22" width="456" height="196" rx="12"/></clipPath>
</defs>
<style>
  .tab{font:600 10.5px Inter,Arial,sans-serif;fill:#9aa4b2}
  .mono{font:500 9px 'JetBrains Mono',monospace}
  .ind{animation:ind 10s infinite cubic-bezier(.65,0,.35,1)}
  @keyframes ind{0%,16%{transform:translateX(0);width:26px}20%,36%{transform:translateX(46px)}40%,56%{transform:translateX(100px)}60%,76%{transform:translateX(180px)}80%,96%{transform:translateX(254px)}100%{transform:translateX(0)}}
  .typ{animation:typ 10s infinite steps(22,end);transform-box:fill-box}
  @keyframes typ{0%{width:0}34%,92%{width:176px}100%{width:0}}
  .cur{animation:blink .9s infinite steps(2,start)}
  @keyframes blink{to{opacity:0}}
  .float{animation:fl 4s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .p{animation:pf 6s ease-in-out infinite;opacity:.7}
  .p1{animation-delay:-1s}.p2{animation-delay:-2s}.p3{animation-delay:-3s}.p4{animation-delay:-4s}.p5{animation-delay:-5s}.p6{animation-delay:-1.5s}.p7{animation-delay:-3.5s}
  @keyframes pf{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(10px,-14px);opacity:.9}}
  .pulse{animation:pu 2.4s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="500" height="240" rx="18" fill="#0a0a14"/>
<rect x="22" y="22" width="456" height="196" rx="12" fill="#12131f" stroke="#262a3d" stroke-width="1.5"/>
<g clip-path="url(#win)">
  <rect x="22" y="22" width="456" height="26" fill="#1a1c2c"/>
  <circle cx="38" cy="35" r="4" fill="#ff5f57"/><circle cx="52" cy="35" r="4" fill="#ffbd2e"/><circle cx="66" cy="35" r="4" fill="#28ca42"/>
  <rect x="90" y="28" width="250" height="14" rx="7" fill="#0f1020"/>
  <text x="102" y="38.5" class="mono" fill="#7fe9b5">sujith9604.github.io/portfolio</text>
  <rect x="22" y="48" width="456" height="1" fill="#262a3d"/>
  <text x="34" y="68" class="tab">Home</text><text x="80" y="68" class="tab">About</text><text x="134" y="68" class="tab">Experience</text><text x="214" y="68" class="tab">Projects</text><text x="288" y="68" class="tab">Contact</text>
  <rect x="34" y="74" width="26" height="2.5" rx="1.2" fill="url(#g)">
    <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.16;0.2;0.36;0.4;0.56;0.6;0.76;0.8;0.96;1" keySplines="0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1" values="34;34;80;80;134;134;214;214;288;288;34"/>
    <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.16;0.2;0.36;0.4;0.56;0.6;0.76;0.8;0.96;1" keySplines="0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1" values="26;26;32;32;60;60;46;46;44;44;26"/>
  </rect>
  <rect x="22" y="80" width="456" height="1" fill="#262a3d"/>
  <text x="44" y="116" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cfd6e4" font-weight="600">Hi, I'm Sujith</text>
  <clipPath id="tc"><rect x="44" y="124" width="0" height="26"><animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.34;0.92;1" values="0;178;178;0"/></rect></clipPath>
  <text x="44" y="143" clip-path="url(#tc)" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="url(#g)">Backend Engineer</text>
  <rect x="44" y="154" width="150" height="6" rx="3" fill="#2a2f46"/><rect x="44" y="167" width="116" height="6" rx="3" fill="#2a2f46"/>
  <rect x="44" y="184" width="74" height="20" rx="10" fill="url(#g)"/><text x="81" y="197.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#06101a">View My Work</text>
  <rect x="126" y="184" width="74" height="20" rx="10" fill="none" stroke="#00ff88" stroke-width="1.2"/><text x="163" y="197.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#00ff88">Get In Touch</text>
  <g class="float">
    <rect x="290" y="96" width="170" height="96" rx="10" fill="#171a2b" stroke="#2b3050"/>
    <circle cx="304" cy="108" r="3" fill="#ff5f57"/><circle cx="315" cy="108" r="3" fill="#ffbd2e"/><circle cx="326" cy="108" r="3" fill="#28ca42"/>
    <text x="304" y="130" class="mono" fill="#ff79c6">const <tspan fill="#8be9fd">dev</tspan> <tspan fill="#cfd6e4">=</tspan> {</text>
    <text x="312" y="145" class="mono" fill="#cfd6e4">stack: <tspan fill="#50fa7b">'Spring Boot'</tspan>,</text>
    <text x="312" y="160" class="mono" fill="#cfd6e4">queue: <tspan fill="#50fa7b">'Kafka'</tspan>,</text>
    <text x="312" y="175" class="mono" fill="#cfd6e4">ship: <tspan fill="#f1fa8c">true</tspan><tspan class="cur" fill="#00ff88"> ▌</tspan></text>
  </g>
  <circle class="p p0" cx="40" cy="150" r="1.6" fill="#0066ff"/><circle class="p p1" cx="92" cy="172" r="2.3" fill="#00ff88"/><circle class="p p2" cx="144" cy="194" r="3.0" fill="#0066ff"/><circle class="p p3" cx="196" cy="150" r="1.6" fill="#00ff88"/><circle class="p p4" cx="248" cy="172" r="2.3" fill="#0066ff"/><circle class="p p5" cx="300" cy="194" r="3.0" fill="#00ff88"/><circle class="p p6" cx="352" cy="150" r="1.6" fill="#0066ff"/><circle class="p p7" cx="404" cy="172" r="2.3" fill="#00ff88"/>
</g>
</svg>